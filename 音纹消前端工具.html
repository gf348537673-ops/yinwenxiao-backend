<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音纹消会员版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Microsoft YaHei,Arial,sans-serif}
body{background:#f5f7fa;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;padding:30px;}
.title{text-align:center;font-size:26px;margin-bottom:20px;color:#222}
.title span{color:#007bff;font-size:18px}
.device-bar{display:flex;align-items:center;gap:10px;background:#f8f9fa;padding:14px;border-radius:8px;margin-bottom:15px;flex-wrap:wrap}
.device-label{font-size:15px}
.device-code{font-family:monospace;color:#007bff}
.copy-btn{background:#007bff;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.active-input{flex:1;min-width:220px;padding:8px;border:1px solid #ddd;border-radius:4px}
.active-btn{background:#28a745;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer}
.status-bar{background:#fff9e6;padding:12px;border-radius:8px;margin-bottom:20px;color:#d48806}
.tab-bar{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:10px 18px;background:#e9ecef;border:none;border-radius:6px;cursor:pointer}
.tab.active{background:#007bff;color:#fff}
.panel{display:none}
.panel.active{display:block}
.upload-box{position:relative;border:2px dashed #007bff;border-radius:8px;padding:40px;text-align:center;background:#f8fbff;margin-bottom:10px;}
.real-file{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.file-info{font-size:14px;text-align:center;margin-bottom:10px}
.tip{font-size:14px;color:#666;margin-bottom:10px}
.start-btn{background:#dc3545;color:#fff;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;width:100%;margin-bottom:15px}
.progress{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:#007bff;width:0%;transition:width 0.3s}
.progress-text{text-align:center;font-size:13px;margin-bottom:15px}
.download-btn{background:#28a745;color:#fff;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;width:100%;display:none}
</style>
</head>
<body>
<div class="container">
<h1 class="title">音纹消会员版 <span>（唯一客服微信：你的微信）</span></h1>

<div class="device-bar">
<span class="device-label">本机机器码：<span class="device-code" id="deviceCode">DEV-XXXX</span></span>
<button class="copy-btn" onclick="copyCode()">复制机器码</button>
<input type="text" class="active-input" id="activeCode" placeholder="请输入36位激活码">
<button class="active-btn" onclick="verifyCode()">立即激活</button>
</div>

<div class="status-bar" id="statusBar">状态：未激活 | 剩余天数：0天 | 剩余次数：0次</div>

<div class="tab-bar">
<button class="tab active" onclick="setTab(1)">消波版</button>
<button class="tab" onclick="setTab(2)">优化版</button>
<button class="tab" onclick="setTab(3)">微噪版</button>
<button class="tab" onclick="setTab(4)">综合版</button>
</div>

<div class="panel active" id="box1">
<div class="upload-box">
<input type="file" class="real-file" id="file1" accept=".wav" onchange="showFile(1,this)">
点击或拖拽 WAV 音频上传
</div>
<div class="file-info" id="name1"></div>
<div class="tip">仅支持 WAV 采样率≤48000</div>
<button class="start-btn" onclick="doProcess(1,'消波版')">开始处理</button>
<div class="progress"><div class="progress-fill" id="bar1"></div></div>
<div class="progress-text" id="text1">等待处理</div>
<button class="download-btn" id="down1">下载成品</button>
</div>

<div class="panel" id="box2">
<div class="upload-box">
<input type="file" class="real-file" id="file2" accept=".wav" onchange="showFile(2,this)">

</div>

<div class="progress"><div class="progress-fill" id="bar2"></div></div>
<div class="progress-text" id="text2">等待处理</div>
<button class="download-btn" id="down2">下载成品</button>
</div>

<div class="panel" id="box3">
<div class="upload-box">
<input type="file" class="real-file" id="file3" accept=".wav" onchange="showFile(3,this)">
点击或拖拽 WAV 音频上传
</div>
<div class="file-info" id="name3"></div>
<div class="tip">仅支持 WAV 采样率≤48000</div>
<button class="start-btn" onclick="doProcess(3,'微噪版')">开始处理</button>
<div class="progress"><div class="progress-fill" id="bar3"></div></div>
<div class="progress-text" id="text3">等待处理</div>
<button class="download-btn" id="down3">下载成品</button>
</div>

<div class="panel" id="box4">
<div class="upload-box">
<input type="file" class="real-file" id="file4" accept=".wav" onchange="showFile(4,this)">
点击或拖拽 WAV 音频上传
</div>
<div class="file-info" id="name4"></div>
<div class="tip">仅支持 WAV 采样率≤48000</div>
<button class="start-btn" onclick="doProcess(4,'综合版')">开始处理</button>
<div class="progress"><div class="progress-fill" id="bar4"></div></div>
<div class="progress-text" id="text4">等待处理</div>
<button class="download-btn" id="down4">下载成品</button>
</div>
</div>
